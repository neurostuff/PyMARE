[build-system]
requires = ["setuptools==83.0.0", "wheel"]

[tool.pytest.ini_options]
testpaths = ["pymare/tests"]
addopts = "--strict-markers"
markers = [
    "stan: tests that sample, needing cmdstanpy and a CmdStan installation (slow: the model is compiled)",
    "robumeta: tests that pin PyMARE against the R package robumeta",
    "metafor: tests that pin PyMARE against the R package metafor",
]

[tool.black]
line-length = 99
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.github
    | \.hg
    | \.pytest_cache
    | _build
    | build
    | dist
  )/
  | versioneer.py
  | pymare/_version.py
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
