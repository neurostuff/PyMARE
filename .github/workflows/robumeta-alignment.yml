name: "Check robumeta alignment"

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "*"
  schedule:
    # Monthly, to catch the harness rotting rather than PyMARE moving: the R
    # version and the robumeta version are pinned, so a failure here on an
    # unchanged tree means the pinned image can no longer be built.
    - cron: "0 0 1 * *"
  # GitHub turns off a workflow with a schedule trigger once the repository has
  # been quiet for 60 days, and a disabled workflow stops answering push and
  # pull_request too -- which is how this one sat switched off from 2025-06-28
  # until it was re-enabled by hand. Being able to dispatch it means the next
  # time that happens, re-enabling is enough to get a run without pushing a
  # commit to prove it works.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robumeta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alignment:
    name: PyMARE vs robumeta
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: "Set up python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install PyMARE"
        run: |
          python -m pip install --progress-bar off --upgrade pip setuptools wheel
          python -m pip install -e .[tests]

      # The pinned reference values are only worth anything if they still match
      # what robumeta prints, so regenerate them from the pinned R image and
      # require the file not to move.
      - name: "Regenerate the reference values from robumeta"
        run: validation/robumeta/regenerate.sh

      # Compared numerically rather than with git diff: the values are written at
      # full double precision, and which BLAS kernel R's image picks depends on
      # the runner's CPU, so two runners disagree in the last bits with the R and
      # robumeta versions identical. See the tolerances in compare_reference.py.
      - name: "Require the reference values to still match robumeta"
        run: |
          git show HEAD:pymare/tests/data/robumeta_reference.json > "${RUNNER_TEMP}/pinned.json"
          python validation/robumeta/compare_reference.py \
              "${RUNNER_TEMP}/pinned.json" \
              pymare/tests/data/robumeta_reference.json \
              | tee -a "$GITHUB_STEP_SUMMARY"

      # Run the alignment tests against the values just regenerated, so this
      # job checks PyMARE against robumeta itself and not only against the pin.
      - name: "Check PyMARE against the regenerated values"
        if: always()
        run: python -m pytest -m robumeta -v

      - name: "Upload the regenerated reference values"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robumeta-reference
          path: pymare/tests/data/robumeta_reference.json
