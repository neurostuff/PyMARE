name: "Benchmark"

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      factor:
        description: "Report a regression once a benchmark is this much slower"
        required: false
        default: "1.3"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  # How much slower a benchmark has to get before this workflow calls it a
  # regression. asv also requires the difference to be statistically
  # significant, so this is the second of two conditions rather than the only
  # one -- without it, the noise on a shared runner would fail most pull
  # requests. Kept in step with regressions_thresholds in asv.conf.json.
  FACTOR: ${{ github.event.inputs.factor || '1.3' }}

jobs:
  benchmark:
    name: Compare against the base branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # asv builds both commits, so it needs their history.
          fetch-depth: 0
      - name: "Set up python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "Install asv"
        run: python -m pip install --progress-bar off asv virtualenv

      - name: "Name the two commits asv will compare"
        run: git fetch origin "${GITHUB_BASE_REF}:base" "${GITHUB_REF}:pr"
      - name: "Register the runner"
        run: asv machine --yes

      - name: "Time both commits"
        id: compare
        run: |
          set -o pipefail
          status=0
          asv continuous --factor "${FACTOR}" --split base pr 2>&1 \
              | tee benchmark.log \
              || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: "Report what changed"
        id: report
        run: |
          {
              echo "## Benchmark: pull request vs \`${GITHUB_BASE_REF}\`"
              echo
              echo "A benchmark is flagged once it is at least \`${FACTOR}x\` slower"
              echo "and the difference is statistically significant."
              echo
              echo '```'
              cat benchmark.log
              echo '```'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Comment on the pull request"
        # A pull request from a fork gets a read-only token, so the comment can
        # fail while the check itself still reports the regression.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- pymare-benchmark -->"
          printf '%s\n\n' "${marker}" | cat - comment.md > body.md
          existing=$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --paginate \
                  --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty"
          )
          if [ -n "${existing}" ]; then
              # Update in place, so a long-running pull request collects one
              # comment rather than one per push.
              gh api --method PATCH \
                  "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                  --field body=@body.md > /dev/null
          else
              gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --field body=@body.md > /dev/null
          fi

      - name: "Fail if a benchmark regressed"
        if: ${{ steps.compare.outputs.status != '0' }}
        run: |
          echo "::error::asv reported a performance regression; see the job summary."
          exit 1

      - name: "Upload the raw results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark.log
            .asv/results
