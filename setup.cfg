[metadata]
url = https://github.com/neurostuff/PyMARE
license = MIT
author = PyMARE developers
author_email = tsalo006@fiu.edu
maintainer = Taylor Salo
maintainer_email = tsalo006@fiu.edu
description = PyMARE: Python Meta-Analysis & Regression Engine
description_file = README.md
long_description = file: pypi_description.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
python_requires = >= 3.9
install_requires =
    numpy>=1.8.0
    pandas
    scipy
    sympy
packages = find:
include_package_data = False

# Without this, find: also picks up benchmarks/, which is a package only so the
# asv modules can share a data builder -- it has no business being installed.
[options.packages.find]
include =
    pymare
    pymare.*

[options.extras_require]
doc =
    m2r2
    matplotlib
    mistune
    numpydoc
    pillow
    recommonmark
    seaborn
    sphinx>=3.5
    sphinx-argparse
    sphinx-copybutton
    sphinx_gallery
    sphinx_rtd_theme
    sphinxcontrib-bibtex
    sphinxcontrib-mermaid
    docutils>=0.18.1,<0.21
tests =
    coverage
    flake8
    flake8-black
    flake8-docstrings
    flake8-isort
    pytest
    pytest-cov
stan =
    cmdstanpy>=1.2,<2
    arviz>=0.17
    # The newest ArviZ that still supports Python 3.9 is 0.17, which predates
    # the removal of scipy.signal.gaussian in scipy 1.13 and imports it
    # unconditionally. Constraining scipy here rather than in install_requires
    # keeps the cap on the extra that needs it, instead of on every PyMARE
    # install that happens to run on 3.9.
    scipy<1.13; python_version < "3.10"
all =
    %(doc)s
    %(tests)s
    %(stan)s

[options.package_data]
* =
    tests/data/*
    resources/*
    resources/datasets/*
    effectsize/*.json
# The Stan program is compiled on first use by CmdStanPy, which needs it on
# disk. include_package_data is False, so this is the only thing that puts it
# in the wheel.
pymare.estimators =
    stan/*.stan

[versioneer]
VCS = git
style = pep440
versionfile_source = pymare/_version.py
versionfile_build = pymare/_version.py
tag_prefix =
parentdir_prefix =

[flake8]
max-line-length = 99
exclude=*build/,_version.py
putty-ignore =
    */__init__.py : +F401
per-file-ignores =
    */__init__.py:D401
ignore = E203,E402,E722,W503
docstring-convention = numpy
